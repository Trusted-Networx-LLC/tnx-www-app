[build]
  command = "npm run build"
  publish = "dist"
  base = "/"

# Serverless functions — currently just the lead-capture bridge to TNX CRM.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- SEO 301 redirects (server-side, before the SPA fallback) ---
# Old service page consolidated into Voice Solutions.
# The two ROI calculators were retired 2026-10-02 (tnx-crm-bus#69): one lead path only — the CRM
# web form embed. The URLs keep their rankings and any external link alive via a 301.
[[redirects]]
  from = "/tools/pots-roi-calculator/"
  to = "/pots-replacement"
  status = 301
  force = true

[[redirects]]
  from = "/tools/ai-roi-calculator/"
